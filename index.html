<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisitPrep</title><style>:root{--c:#00897b}body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fb;color:#1a1a2e}header{padding:1.5rem;text-align:center;color:#fff;background:var(--c,#334)}main{max-width:760px;margin:auto;padding:1rem}.card{background:#fff;border-radius:12px;padding:1rem 1.25rem;margin:1rem 0;box-shadow:0 2px 6px #0001}label{display:block;margin:.5rem 0}input,select,textarea{display:block;width:100%;padding:.5rem;font-size:1rem;box-sizing:border-box}button{background:var(--c,#334);color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;font-size:1rem;cursor:pointer;margin:.3rem .3rem 0 0}button:focus,input:focus{outline:3px solid #f90}table{width:100%;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #ddd;text-align:left}.big{font-size:2rem;font-weight:700} .tag{display:inline-block;background:#e0f2f1;border-radius:999px;padding:.2rem .6rem;margin:.15rem}.urgent{background:#fde8e8;border-left:6px solid #c62828;padding:.8rem;border-radius:8px}pre{white-space:pre-wrap;background:#f7f7f7;padding:1rem;border-radius:8px}</style></head><body>
<header><h1>🩺 VisitPrep</h1><p>Describe how you feel in your own words. Get a clear, structured summary to bring to your doctor.</p></header><main>
<p class="card"><small>Not a diagnosis or medical advice. If you think it's an emergency, call 911.</small></p>
<section class="card"><label for="tx">What's going on?</label><textarea id="tx" rows="5" placeholder="e.g. I've had a bad headache for 3 days, worse in the morning, and I feel dizzy and nauseous. Tylenol helps a little."></textarea><button id="go">Analyze</button><button id="ex">Try example</button></section>
<section class="card" id="out" hidden aria-live="polite"><div id="urg"></div><h2>Detected</h2><p id="tags"></p><h2>Summary for your doctor</h2><pre id="sum"></pre><h2>Questions to ask</h2><ul id="qs"></ul><button id="cp">📋 Copy summary</button></section>
</main><script src="nlp.js"></script><script src="app.js"></script></body></html>
